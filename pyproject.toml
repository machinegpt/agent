[build-system]
requires = ["setuptools>=77.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jinx"
dynamic = ["version"]
description = "Enterprise Sovereign Agent Framework for Editor Integrations"
readme = "README.md"
requires-python = ">=3.10"
# The JINX End User License Agreement (PEP 639): `LicenseRef-` names a license that has no SPDX identifier, and the
# files below carry its text (the English one governs).
license = "LicenseRef-JINX-EULA"
license-files = ["LICENSE.md", "LICENSE_RU.md"]
authors = [
    { name = "JINX Enterprise Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0"
]

[project.scripts]
# `jinx install` puts JINX into a project, `jinx doctor` checks it. `jinx-cli` is the runtime itself (what `.agent/jinx.py` runs).
jinx = "jinx.install:main"
jinx-cli = "jinx.cli:main"

[tool.setuptools.packages.find]
where = [".agent/src"]

# One place for the version: jinx/__init__.py, so the package metadata cannot drift from it.
[tool.setuptools.dynamic]
version = { attr = "jinx.__version__" }
