[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jinx"
version = "1.1.6"
description = "Enterprise Sovereign Agent Framework for Editor Integrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "JINX Enterprise Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0"
]

[project.scripts]
jinx-cli = "jinx.cli:main"

[tool.setuptools.packages.find]
where = [".agent/src"]

