[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jinx"
dynamic = ["version"]
description = "Enterprise Sovereign Agent Framework for Editor Integrations"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "JINX Enterprise Team" }
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0.0"
]

[project.scripts]
jinx-cli = "jinx.cli:main"

[tool.setuptools.packages.find]
where = [".agent/src"]

# One place for the version: jinx/__init__.py, so the package metadata cannot drift from it.
[tool.setuptools.dynamic]
version = { attr = "jinx.__version__" }
